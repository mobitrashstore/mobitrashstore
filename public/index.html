  <!-- BLOCK CONTEXT MENU SCRIPT -->
  <script defer>
    (function () {
      // --- INTERACTION BLOCKER (Context Menu & Selection Vibration Prevention) ---
      function protectContent(e) {
        // Allow Admin Mode to bypass
        if (document.body && (document.body.classList.contains('admin-mode') || window.location.pathname.startsWith('/admin'))) {
          return true;
        }

        // Only block on mobile devices
        if (window.innerWidth > 768) { // If desktop, allow right-click
          return true;
        }

        // Input Exception: Allow typing
        let target = e.target;
        let depth = 4; // Check up to 4 parents
        while (target && target !== document && depth > 0) {
          if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable || target.tagName === 'SELECT') {
            return true;
          }
          target = target.parentElement;
          depth--;
        }

        // Block Right Click / Long Press Context Menu on mobile only
        e.preventDefault();
        e.stopPropagation();
        return false;
      }

      // Apply blockers globally for context menu
      window.addEventListener('contextmenu', protectContent, { passive: false, capture: true });

      // Disable text selection popup on long press for iOS
      document.documentElement.style.webkitUserSelect = 'none'; // iOS
      document.documentElement.style.userSelect = 'none'; // Standard
    })();
  </script>

  <style>
    /* NUCLEAR SCROLLBAR HIDING & NO-SELECT GLOBAL OVERRIDE */
    html,

      scrollbar-width: none !important;

    }

    /* --- MOBILE SPECIFIC BLOCKS (Max Width 768px) --- */
    @media (max-width: 768px) {

      html,
      body,
      #root,
      * {
        /* Disable touch callout (the magnifying glass / context menu on long press) */
        -webkit-touch-callout: none !important;

        /* Disable tap highlight color on mobile */
        -webkit-tap-highlight-color: transparent !important;

        /* Disable text selection on mobile to prevent vibration */
        -webkit-user-select: none !important;
        user-select: none !important;

        /* Disable pinch zoom via CSS as backup */
        touch-action: pan-x pan-y !important;
      }

      /* Explicitly re-enable text entry for inputs on mobile */
      input,
      textarea,
      [contenteditable="true"],
      select {
        -webkit-user-select: text !important;
        user-select: text !important;
        -webkit-touch-callout: default !important;
      }
    }

    /* Admin Mode Override */
    body.admin-mode * {
      -webkit-touch-callout: default !important;
      -webkit-user-select: text !important;

    ::-webkit-scrollbar {

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 40%, #ff5722 0%, #0f172a 60%, #0a0f1e 100%);
      background-size: 200% 200%;
      animation: gradientPulse 4s ease infinite;
      color: white;
      transition: opacity 0.4s ease-out;
      touch-action: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    @keyframes gradientPulse {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .splash-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 400px;
      position: relative;
      justify-content: center;
      gap: 0.2rem;
      /* Reduced space between lines */
    }

    /* Animated Typewriter Letters */
    .splash-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.05em;
      flex-wrap: nowrap;
    }

    .splash-word-gap {
      width: 0.3em;
    }

    .splash-letter {
      font-size: 2.2rem;
      /* Adjusted for 2 lines */
      font-weight: 900;
      color: #000000;
      /* BLACK TEXT */
      opacity: 0;
      transform: translateY(20px);
      animation: letterReveal 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.4);
      display: inline-block;
      line-height: 1.1;
    }

    @keyframes letterReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Cart Icon Animation */
    .splash-icon-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 0.3rem;
      opacity: 0;
      animation: iconEnter 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .splash-cart-icon {
      width: 32px;
      height: 32px;
      color: #000000;
      /* BLACK ICON */
      fill: #000000;
      filter: drop-shadow(0 1px 2px rgba(255, 255, 255, 0.4));
    }

    @keyframes iconEnter {
      0% {
        opacity: 0;
        transform: scale(0) rotate(-20deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    .splash-cart-icon.animate-bounce {
      animation: bounceIcon 2s ease-in-out infinite;
    }

    @keyframes bounceIcon {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    .splash-footer {
      position: absolute;
      bottom: 30px;
      left: 0;
      width: 100%;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 1.8s forwards;
    }

    .splash-footer-text {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #000000;
      opacity: 0.8;
    }

    .loader-bar {
      width: 60px;
      height: 4px;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 2px;
      margin-top: 1.5rem;
      overflow: hidden;
      position: relative;
      opacity: 0;
      animation: fadeIn 0.5s ease-out 0.2s forwards;
    }

    .loader-bar::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 40%;
      background: #000000;
      border-radius: 2px;
      animation: loadingSwipe 1.5s infinite ease-in-out;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes loadingSwipe {
      0% {
        left: -40%;
        width: 30%;
      }

      50% {
        width: 60%;
      }

      100% {
        left: 100%;
        width: 30%;
      }
    }

    @media (min-width: 769px) {
      .splash-letter {
        font-size: 3.5rem;
      }

      .splash-cart-icon {
        width: 48px;
        height: 48px;
      }

      .loader-bar {
        width: 100px;
        height: 5px;
      }

      .splash-footer-text {
        font-size: 0.85rem;
      }
    }
  </style>

            console.log('ServiceWorker registration failed: ', err);
          });
      });
    }

    // Standalone detection helper for removing address bars
    if (window.matchMedia('(display-mode: standalone)').matches || (window.navigator.standalone === true)) {

    }
  </script>
